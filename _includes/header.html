<header>
  <section>
    {% if page.url != "/" %}
    <h2 class="site-title"><a href="/">{{ site.title }}</a></h2>
    {% else %}<h1 class="site-title"><a href="/">{{ site.title }}</a></h1>
    {% endif %}
    <p class="site-description">{{ site.description }}</p>
  </section>
  <nav>
  {% for item in site.data.navigation %}
    <a href="{{ item.link }}" {% if page.url == item.link %}class="active"{% endif %}>
      {{ item.name }}
    </a>
  {% endfor %}
  </nav>
</header>
<hr />
